services:
  trinitycore-docker:
    image: danielsilvestre37/trinitycore-docker:4.4.2
    restart: unless-stopped
    environment:
      - PUBLIC_IP_ADDRESS=127.0.0.1
      # - REALM_NAME=TrinityCore Server
      # - ACCESS_USERNAME=admin
      # - ACCESS_PASSWORD=admin
      # Optional Trinity config overrides at startup:
      # Pattern: TC_WORLD__Section__Key=value  -> Section.Key = value
      # Pattern: TC_AUTH__Section__Key=value   -> Section.Key = value
      # - TC_WORLD__Rate__XP__Kill=3
      # - TC_WORLD__PlayerLimit=200
      # - TC_WORLD__Motd="Welcome to my realm"
      # - TC_AUTH__Battlenet__PasswordChangeSecurity=0
    volumes:
      - server_data:/app/server/data
      - server_logs:/app/server/logs
      - ./client:/app/client # Mount the client directory    
      - type: tmpfs
        target: /app/tmp
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8085:8085"
      - "1119:1119"
      - "8086:8086"
      - "3000:3000" # Web server
    #deploy:
    #  resources:
    #    limits:
    #      cpus: "4.0"
    #      memory: "8g"
    #    reservations:
    #      cpus: "4.0"
    #      memory: "8g"
  database:
    image: mysql:8.4.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trinityroot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptrinityroot"]
      interval: 10s
      timeout: 30s 
      retries: 3
volumes:
  db_data:
  server_data:
  server_logs:
