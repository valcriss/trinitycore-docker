name: Build and Push Docker image

on:
  push:
    tags:
      - '*'
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: 3.3.5
            dockerfile: ./Dockerfile.335
            tag: danielsilvestre37/trinitycore-docker:3.3.5
          - name: 4.4.2
            dockerfile: ./Dockerfile.442
            tag: danielsilvestre37/trinitycore-docker:4.4.2
          - name: 11.2.0
            dockerfile: ./Dockerfile.1120
            tag: danielsilvestre37/trinitycore-docker:11.2.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image (${{ matrix.name }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.tag }}
